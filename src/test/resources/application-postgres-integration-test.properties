# =============================================================================
# CP-3.3.5 - PostgreSQL JSONB Persistence Integration Test
# =============================================================================
# This profile is loaded ONLY by AiMessagePostgresJsonbIntegrationTest and
# is opt-in. The default mvn test run does not activate this profile.
#
# All values come from environment variables; nothing sensitive is hardcoded.
# The integration test class refuses to run unless:
#   - IT_TEST_PG == "true" (opt-in flag)
#   - IT_TEST_PG_URL, IT_TEST_PG_USERNAME, IT_TEST_PG_PASSWORD are set
#   - the URL's database name contains the test marker "cp335_test"
#   - the column metadata type in information_schema is "jsonb"
#
# This file is intentionally a bare override on top of application.properties
# (and application-test.properties is NOT loaded for this profile) so the
# PostgreSQL driver and Flyway are the ones that run the migration. The
# dev/prod datasource defined in application.properties is NOT used here:
# the IT_TEST_PG_URL env var points at the dedicated test database.
# =============================================================================

# --- Opt-in flag (the test class refuses to run unless this is "true") ---
it.test.pg.enabled=${IT_TEST_PG:false}

# --- Datasource (all from env, no defaults) ---
spring.datasource.url=${IT_TEST_PG_URL:jdbc:postgresql://localhost:5432/itticketing_cp339_test?options=-c%20client_encoding%3DUTF8}
spring.datasource.username=${IT_TEST_PG_USERNAME:postgres}
spring.datasource.password=${IT_TEST_PG_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA: don't validate (matches production setting application=none) ---
# We deliberately set ddl-auto=none (the same value the production
# application.properties sets) so the integration test runs even
# if some other entity in the project has an unrelated column-type
# mismatch with its migration. This test's scope is CP-3.3.5
# (AiMessage.metadata JSONB round-trip); other entities are not
# under review here. The catalog check in the test class itself
# verifies the ai_message.metadata column type directly via
# information_schema, so we still get a hard guarantee that the
# column under test is real jsonb.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

# --- Flyway: run the production migrations against the test database ---
# This is the same migration set used in dev/prod (classpath:db/migration)
# so the JSONB column type and check constraints are exactly what the
# production code expects. The schema is dedicated to this test instance,
# so running migrations here cannot affect any other database.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.default-schema=public
spring.flyway.schemas=public
spring.flyway.location=classpath:db/migration
spring.flyway.create-schemas=true

# --- Disable email/Ollama to keep the test focused on persistence ---
spring.mail.host=localhost
spring.mail.port=2525
app.email.enabled=false
ollama.enabled=false
ollama.base-url=http://localhost:11434
ollama.embedding-model=nomic-embed-text

# --- Reduce log noise ---
logging.level.root=WARN
logging.level.com.example.ticketing=INFO
logging.level.org.flywaydb=INFO
