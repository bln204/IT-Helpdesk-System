spring.application.name=ticketing
server.port=${PORT:8080}

# UTF-8 Encoding Configuration
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# Tomcat URI encoding (fix for Vietnamese in URL params)
server.tomcat.uri-encoding=UTF-8
server.tomcat.use-legacy-encoding=false

# Debug logging configuration
debug.logging.endpoint=${DEBUG_LOGGING_ENDPOINT:http://127.0.0.1:7782/ingest/af8e00f4-e3f5-4cdd-8f67-3ab8c1d15692}
debug.logging.session-id=${DEBUG_LOGGING_SESSION_ID:a25ec3}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/itticketing?options=-c%20client_encoding%3DUTF8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.default-schema=public
spring.flyway.schemas=public
spring.flyway.location=classpath:db/migration
spring.flyway.create-schemas=true

# Hibernate schema configuration - must match Flyway schema
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# SECURITY JWT CONFIGURATION
# IMPORTANT: You MUST set a strong secret in production!
# The secret must be at least 32 characters (256 bits) for HMAC-SHA256
# Generate a secure random secret with:
#   openssl rand -base64 48
# Or use: https://generate-secret.vercel.app/48
#
# Example valid configuration:
#   SECURITY_JWT_SECRET=your-secure-random-string-at-least-32-chars-long-here
security.jwt.secret=${SECURITY_JWT_SECRET:change-this-secret-to-a-long-random-value}
security.jwt.issuer=${SECURITY_JWT_ISSUER:ticketing}
security.jwt.expiration-seconds=${SECURITY_JWT_EXPIRATION_SECONDS:3600}

# Rate Limiting Configuration
# Max failed login attempts before lockout
rate-limit.max-attempts=5
# Lockout duration in seconds (15 minutes)
rate-limit.lockout-duration-seconds=900

# ============== EMAIL/SMTP CONFIGURATION ==============
# Enable/disable email sending (set to false to disable email)
email.enabled=${EMAIL_ENABLED:true}

# SMTP Server Configuration (Gmail example)
# For Gmail: Use App Password instead of regular password
# Generate App Password: Google Account -> Security -> 2-Step Verification -> App Passwords
spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME:lenambui3@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:jtxvazlkscebulpc}
spring.mail.properties.mail.smtp.auth=${EMAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${EMAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${EMAIL_SMTP_STARTTLS_REQUIRED:true}

# Email sender configuration
email.from.name=${EMAIL_FROM_NAME:IT Ticketing System}
email.from.address=${EMAIL_FROM_ADDRESS:noreply@itticketing.local}
email.reply-to=${EMAIL_REPLY_TO:}


# File Upload Configuration
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

logging.level.com.example.ticketing.auth=DEBUG

# ============== AUTHORIZATION CONFIGURATION ==============
# Single source of truth for resolving the IT department.
# Phase 1 only centralizes department resolution; it does NOT change any authorization policy.
ticketing.authorization.it-department-code=${IT_DEPARTMENT_CODE:IT}

# ============== OLLAMA AI CONFIGURATION ==============
# Ollama API for vector embeddings
ollama.enabled=${OLLAMA_ENABLED:true}
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.embedding-model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:60}

# Ollama Chat Model Configuration (Phase 5)
# Chat model for AI assistant. qwen3:4b-instruct-2507 (Q4_K_M, ~2.5 GB) fits a
# 4 GB VRAM GPU (RTX 3050), is non-thinking (no empty answers from a burned
# reasoning budget) and handles Vietnamese better than gemma3:4b.
# Rollback: OLLAMA_CHAT_MODEL=gemma3:4b. Configurable via OLLAMA_CHAT_MODEL.
ollama.chat-model=${OLLAMA_CHAT_MODEL:qwen3:4b-instruct-2507-q4_K_M}
# Context window sent as options.num_ctx. Ollama's default (2048) truncates the
# ~8k-token system prompt. Must cover system prompt + RAG data + history +
# chat-max-tokens. Pair with OLLAMA_FLASH_ATTENTION=1 / OLLAMA_KV_CACHE_TYPE=q8_0
# on the Ollama server to keep the KV cache inside 4 GB VRAM.
ollama.chat-num-ctx=${OLLAMA_CHAT_NUM_CTX:12288}
# Optional "think" flag. Empty = not sent (correct for instruct models).
# Set to false when using a hybrid reasoning model such as qwen3:4b.
ollama.chat-think=${OLLAMA_CHAT_THINK:}
# Keep the model loaded between questions (avoids cold reloads).
ollama.chat-keep-alive=${OLLAMA_CHAT_KEEP_ALIVE:30m}
# Timeout for chat generation (seconds) - must be longer than embedding timeout
ollama.chat-timeout-seconds=${OLLAMA_CHAT_TIMEOUT_SECONDS:180}
# Temperature for generation (0.0 = deterministic, 1.0 = creative). Gemma3
# responds well to low values for factual IT Helpdesk answers.
ollama.chat-temperature=${OLLAMA_CHAT_TEMPERATURE:0.2}
# Maximum tokens to generate (limits response length). Gemma3:4b on this
# dataset typically produces 30-60 tokens; 2048 gives headroom for
# self-service troubleshooting answers. See Phase 7.7 hotfix-4.
ollama.chat-max-tokens=${OLLAMA_CHAT_MAX_TOKENS:2048}

# ===== AI Query Planner =====
ai.planner.timeout-seconds=30
ai.composer.timeout-seconds=60
ai.query.page-size=20
ai.query.max-limit=50
ai.query.semantic-min-score=0.65

# Swagger chỉ public khi bật tường minh (dev local)
app.security.swagger-public=false
