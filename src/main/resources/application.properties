spring.application.name=ticketing
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/IT-Ticketing}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.default-schema="IT-Ticketing"
spring.flyway.schemas="IT-Ticketing"
security.jwt.secret=${SECURITY_JWT_SECRET:change-this-secret-to-a-long-random-value}
security.jwt.issuer=${SECURITY_JWT_ISSUER:ticketing}
security.jwt.expiration-seconds=${SECURITY_JWT_EXPIRATION_SECONDS:3600}
